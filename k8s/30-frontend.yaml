apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: deskflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: frontend }
  template:
    metadata:
      labels: { app: frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/sellwane7/deskflow-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 15
          readinessProbe:
            httpGet: { path: /healthz, port: 8080 }
            periodSeconds: 10
          resources:
            requests: { cpu: 20m, memory: 32Mi }
            limits: { cpu: 100m, memory: 96Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: deskflow
spec:
  selector: { app: frontend }
  ports:
    - port: 3000
      targetPort: 8080
