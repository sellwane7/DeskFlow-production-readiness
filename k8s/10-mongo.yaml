apiVersion: apps/v1
kind: Deployment
metadata:
  name: mongo
  namespace: deskflow
spec:
  replicas: 1
  selector:
    matchLabels: { app: mongo }
  template:
    metadata:
      labels: { app: mongo }
    spec:
      containers:
        - name: mongo
          image: mongo:7
          ports:
            - containerPort: 27017
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: data
              mountPath: /data/db
      volumes:
        - name: data
          emptyDir: {}   # demo only: data is lost when the pod restarts. Use a PVC for real use.
---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: deskflow
spec:
  selector: { app: mongo }
  ports:
    - port: 27017
      targetPort: 27017
