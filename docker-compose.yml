services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      PORT: 5000
      NODE_ENV: production
      MONGO_URI: mongodb://mongo:27017/deskflow
      JWT_SECRET: ${JWT_SECRET:-change-me-in-real-deployments}
      JWT_EXPIRES_IN: 8h
      CLIENT_ORIGIN: http://localhost:3000
    ports:
      - "5000:5000"
    depends_on:
      mongo:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        REACT_APP_API_URL: http://localhost:5000/api
    ports:
      - "3000:8080"
    depends_on:
      - backend

  seed:
    build: ./backend
    command: ["node", "seed.js"]
    environment:
      MONGO_URI: mongodb://mongo:27017/deskflow
    depends_on:
      mongo:
        condition: service_healthy
    profiles: ["seed"]

volumes:
  mongo-data:
